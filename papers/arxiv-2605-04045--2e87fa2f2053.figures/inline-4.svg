</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.21 21.37)"><foreignobject style="--ltx-fo-width:43.7em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="78.72" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="604.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS3.SSS3.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S4.SS3.SSS3.p6.pic1.2.1" class="ltx_p"><span id="S4.SS3.SSS3.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strengths include lower end-to-end latency, more consistent cross-modal alignment, and fewer brittle interfaces between modules. Key challenges include stable and general tokenization for heterogeneous audio (speech/music/sound effects), long-context temporal modeling for video, streaming memory and interruption handling, and evaluation protocols for open-ended multimodal outputs.</span></span>
</span></span></span></foreignobject></g></g></svg>