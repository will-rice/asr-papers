</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.21 21.37)"><foreignobject style="--ltx-fo-width:43.7em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="62.11" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="604.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS1.SSS3.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S7.SS1.SSS3.p6.pic1.2.1" class="ltx_p"><span id="S7.SS1.SSS3.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The biggest bottleneck is still data, not architecture. Synthetic instruction data scales, but it rarely captures authentic conversational timing, grounded audio events, or the spontaneity of human-human interaction. Until naturalistic AV dialogue corpora become much larger, omni-modal conversation will likely continue to underperform its architectural promise.</span></span>
</span></span></span></foreignobject></g></g></svg>