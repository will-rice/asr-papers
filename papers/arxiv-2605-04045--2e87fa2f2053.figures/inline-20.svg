</span>
<span id="S7.SS1.SSS1.p7.pic1.1.2" class="ltx_p"><span id="S7.SS1.SSS1.p7.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Trend: Speech Drops the Cascade</span></span>
</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.21 21.37)"><foreignobject style="--ltx-fo-width:43.7em;--ltx-fo-height:4.31em;--ltx-fo-depth:0.19em;font-size:10pt;" height="62.39" overflow="visible" transform="matrix(1 0 0 -1 0 59.7)" width="604.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS1.SSS1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S7.SS1.SSS1.p7.pic1.2.1" class="ltx_p"><span id="S7.SS1.SSS1.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Speech interaction is moving away from hard ASR<math id="S7.SS1.SSS1.p7.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>LLM<math id="S7.SS1.SSS1.p7.pic1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>TTS decomposition, but cascades are not obsolete. End-to-end systems are better at latency and prosody preservation, whereas cascades still win on modularity and controllable intermediate text. The most practical near-term compromise is token-based hybrids that keep more acoustic detail without giving up LLM-compatible interfaces.</span></span>
</span></span></span></foreignobject></g></g></svg>