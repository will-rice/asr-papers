<span id="S6.SS3.SSS3.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S6.SS3.SSS3.p5.pic1.2.1" class="ltx_p"><span id="S6.SS3.SSS3.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The field is shifting from coarse joint modification to precise cross-modal intervention. The real challenge is not just editing audio and video together, but doing so locally, synchronously, and with minimal side effects. This trend is pushing joint AV editing toward finer-grained supervision and unified AV foundation models.</span></span>
