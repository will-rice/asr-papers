<span id="S5.SS1.SSS3.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S5.SS1.SSS3.p6.pic1.2.1" class="ltx_p"><span id="S5.SS1.SSS3.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Recent work shows a clear shift from closed-set to open-vocabulary AVEL, aiming at more scalable and flexible multimodal understanding. By leveraging semantic embeddings, large-scale pre-training, and language-aligned representations, these methods can localize unseen events at inference time. This trend reflects the broader move in multimodal learning toward semantic generalization and deployment in open-world environments.</span></span>
</span></span></span></foreignobject></g></g></svg>