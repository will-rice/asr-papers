<span id="S5.SS3.SSS2.p6.pic1.1.2" class="ltx_p"><span id="S5.SS3.SSS2.p6.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Open Problem: Reasoning Must Stay Grounded</span></span>
</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.21 18.68)"><foreignobject style="--ltx-fo-width:43.7em;--ltx-fo-height:6.69em;--ltx-fo-depth:0em;font-size:10pt;" height="92.63" overflow="visible" transform="matrix(1 0 0 -1 0 92.63)" width="604.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS3.SSS2.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S5.SS3.SSS2.p6.pic1.2.1" class="ltx_p"><span id="S5.SS3.SSS2.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">These trends suggest a shift from step-wise chain-of-thought to more grounded multimodal reasoning with reinforcement-based training. Yet models still suffer from hallucinations, spurious correlations, and unfaithful reasoning. Recent work also frames reasoning as inference over latent chains, emphasizing diversity and uncertainty. Future progress will require tighter perception-reasoning integration, better grounding rewards, and benchmarks for both correctness and faithfulness.</span></span>
</span></span></span></foreignobject></g></g></svg>