<span id="S5.SS3.SSS1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.7em;">
<span id="S5.SS3.SSS1.p7.pic1.2.1" class="ltx_p"><span id="S5.SS3.SSS1.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Audio reasoning is emerging from audio perception through the adaptation of LLM paradigms to acoustic signals. Recent progress shows that prompting, instruction tuning, and reasoning-oriented training can elicit multi-step inference, but current models still struggle with complex temporal and causal relationships. Future work will likely focus on improving reasoning faithfulness and consistency, strengthening temporal-causal modeling, and developing better training signals and benchmarks.</span></span>
</span></span></span></foreignobject></g></g></svg>