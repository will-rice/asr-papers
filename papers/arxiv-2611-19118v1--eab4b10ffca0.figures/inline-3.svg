<span id="S2.F1.pic1.6" class="ltx_inline-block ltx_minipage ltx_align_top" style="width:28.12em;">
<span id="S2.F1.pic1.6.1" class="ltx_p"></span>
<span id="S2.F1.pic1.6.2" class="ltx_p ltx_align_left"><span id="S2.F1.pic1.6.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">How the line of turn <math id="S2.F1.pic1.m3" class="ltx_Math" alttext="n+1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">n+1</annotation></semantics></math> is chosen
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="S2.F1.pic1.6.2.1.1" class="ltx_text ltx_font_medium">
Turn without branches: its only recording.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
Turn with branches (6 of 40): fixed rules, checked in order; the first that holds picks the recording. They look at what the agent said: an amount (in that response or earlier in the call), a compensation, or certain phrases.
<br class="ltx_break" style="--ltx-break-space:6.0pt;">
</span>Example: scenario 2, turn 5
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="S2.F1.pic1.6.2.1.2" class="ltx_text ltx_font_medium">
If the agent has offered 18,000 or more: “Órale, así sí me late” (“Alright, that works for me”).
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
Else, if it offered a compensation in that response: “Está bien lo de la compensación, pero el número tiene que ser dieciocho mil” (“The compensation is fine, but the number has to be eighteen thousand”).
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
Otherwise: “Ya casi. Nada más déjelo en 18,000 parejo” (“Almost there. Just make it an even 18,000”).</span></span></span>
</span></span></span></foreignobject></g></g><g style="--ltx-stroke-color:#808080;--ltx-fill-color:#808080;--ltx-fg-color:#808080;" color="#808080" fill="#808080" stroke="#808080" stroke-dasharray="3.0pt,3.0pt" stroke-dashoffset="0.0pt" stroke-width="0.8pt"><path style="fill:none" d="M 108.17 -225.82 L 151.48 -225.82" /></g></g></svg>