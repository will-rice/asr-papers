<svg id="A3.T14.pic1" class="ltx_picture ltx_centering" height="669.8" overflow="visible" version="1.1" viewbox="0 0 477.38 669.8" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,669.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 669.8 L 477.38 669.8 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 0.55 L 0.55 650.71 L 476.82 650.71 L 476.82 0.55 Z" /></g><g style="--ltx-fill-color:#262626;" fill="#262626" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 651.26 L 0.55 669.25 L 476.82 669.25 L 476.82 651.26 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.47 657.14)"><foreignobject style="--ltx-fo-width:31.38em;--ltx-fo-height:0.73em;--ltx-fo-depth:0.24em;font-size:9.25pt;" height="12.45" overflow="visible" transform="matrix(1 0 0 -1 0 9.34)" width="401.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.38em;">
<span id="A3.T14.pic1.1.1" class="ltx_p"><span id="A3.T14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Ontology Induction Prompt (Step 2: Merging into Meta-Clusters)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.47 43.14)"><foreignobject style="--ltx-fo-width:39.32em;--ltx-fo-height:46.93em;--ltx-fo-depth:2.79em;font-size:9.25pt;" height="636.32" overflow="visible" transform="matrix(1 0 0 -1 0 600.66)" width="503.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.32em;">
<span id="A3.T14.pic1.2.1" class="ltx_p"><span id="A3.T14.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Role.<span id="A3.T14.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a senior surgical educator and ontology designer refining a clinical label space. Your goal is to merge fine-grained clusters into broader, more practical ”meta-clusters” that are functionally relevant for training a machine learning model.</span></span></span>
<span id="A3.T14.pic1.2.2" class="ltx_p"><span id="A3.T14.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instructions<span id="A3.T14.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I17" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I17.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I17.i1.p1" class="ltx_para">
<span id="A3.I17.i1.p1.1" class="ltx_p"><span id="A3.I17.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You will receive a list of fine-grained clusters, where each cluster has a name and a list of members.</span></span>
</span></span>
<span id="A3.I17.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I17.i2.p1" class="ltx_para">
<span id="A3.I17.i2.p1.1" class="ltx_p"><span id="A3.I17.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Your task is to merge these fine-grained clusters into a smaller number of high-level meta-clusters based on their shared surgical </span><span id="A3.I17.i2.p1.1.2" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">function</span><span id="A3.I17.i2.p1.1.3" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> or </span><span id="A3.I17.i2.p1.1.4" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">purpose</span><span id="A3.I17.i2.p1.1.5" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A3.I17.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I17.i3.p1" class="ltx_para">
<span id="A3.I17.i3.p1.1" class="ltx_p"><span id="A3.I17.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">For each new meta-cluster, assign a canonical, high-level name that is intuitive and clinically standard (e.g., coagulate, apply_traction, prostate_tissue).</span></span>
</span></span>
<span id="A3.I17.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I17.i4.p1" class="ltx_para">
<span id="A3.I17.i4.p1.1" class="ltx_p"><span id="A3.I17.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Use the provided few-shot examples to guide your merging logic. The goal is to create categories that are distinct and frequent enough for robust classification.</span></span>
</span></span>
</span>
<span id="A3.T14.pic1.2.3" class="ltx_p"><span id="A3.T14.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Formatting<span id="A3.T14.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A3.I18" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I18.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I18.i1.p1" class="ltx_para">
<span id="A3.I18.i1.p1.1" class="ltx_p"><span id="A3.I18.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Produce a structured list. For each meta-cluster, state its new canonical name, followed by the names of the fine-grained clusters it now contains.</span></span>
</span></span>
<span id="A3.I18.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I18.i2.p1" class="ltx_para">
<span id="A3.I18.i2.p1.1" class="ltx_p"><span id="A3.I18.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Ensure the output is clean and directly usable as a mapping dictionary.</span></span>
</span></span>
</span>
<span id="A3.T14.pic1.2.4" class="ltx_p"><span id="A3.T14.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Input<span id="A3.T14.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.I19" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I19.i1.p1" class="ltx_para">
<span id="A3.I19.i1.p1.1" class="ltx_p"><span id="A3.I19.i1.p1.1.1" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Fine-Grained Clusters</span><span id="A3.I19.i1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> (str): The structured output from the first clustering step.</span></span>
</span></span>
<span id="A3.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I19.i2.p1" class="ltx_para">
<span id="A3.I19.i2.p1.1" class="ltx_p"><span id="A3.I19.i2.p1.1.1" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Merge Examples</span><span id="A3.I19.i2.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> (str): A few examples showing how to merge related clusters under a new meta-cluster name.</span></span>
</span></span>
</span>
<span id="A3.T14.pic1.2.5" class="ltx_p"><span id="A3.T14.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Output<span id="A3.T14.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A3.I20" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I20.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I20.i1.p1" class="ltx_para">
<span id="A3.I20.i1.p1.1" class="ltx_p"><span id="A3.I20.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">(str) A formatted string showing the final meta-cluster mapping.</span></span>
</span></span>
</span>
<span id="A3.T14.pic1.2.6" class="ltx_p"><span id="A3.T14.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Fine-Grained Clusters to Merge: {structured_list_from_step_1}
<br class="ltx_break">Merge Examples: {few_shot_examples}
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
