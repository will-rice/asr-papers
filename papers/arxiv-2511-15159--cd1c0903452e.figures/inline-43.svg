<svg id="A3.T13.pic1" class="ltx_picture ltx_centering" height="672.45" overflow="visible" version="1.1" viewbox="0 0 477.38 672.45" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,672.45) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 672.45 L 477.38 672.45 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 0.55 L 0.55 653.35 L 476.82 653.35 L 476.82 0.55 Z" /></g><g style="--ltx-fill-color:#262626;" fill="#262626" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 653.91 L 0.55 671.89 L 476.82 671.89 L 476.82 653.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.47 659.79)"><foreignobject style="--ltx-fo-width:31.38em;--ltx-fo-height:0.73em;--ltx-fo-depth:0.24em;font-size:9.25pt;" height="12.45" overflow="visible" transform="matrix(1 0 0 -1 0 9.34)" width="401.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.38em;">
<span id="A3.T13.pic1.1.1" class="ltx_p"><span id="A3.T13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Ontology Induction Prompt (Step 1: Fine-Grained Clustering)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.47 43.14)"><foreignobject style="--ltx-fo-width:39.32em;--ltx-fo-height:47.14em;--ltx-fo-depth:2.79em;font-size:9.25pt;" height="638.97" overflow="visible" transform="matrix(1 0 0 -1 0 603.3)" width="503.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.32em;">
<span id="A3.T13.pic1.2.1" class="ltx_p"><span id="A3.T13.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Role.<span id="A3.T13.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are an expert in clinical language and surgical ontology design. Your task is to analyze a list of raw textual mentions extracted from surgeon feedback and group them into semantically coherent, fine-grained clusters.</span></span></span>
<span id="A3.T13.pic1.2.2" class="ltx_p"><span id="A3.T13.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instructions<span id="A3.T13.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I13" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I13.i1.p1" class="ltx_para">
<span id="A3.I13.i1.p1.1" class="ltx_p"><span id="A3.I13.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You will be given a list of raw text mentions from a specific category: </span><span id="A3.I13.i1.p1.1.2" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instrument</span><span id="A3.I13.i1.p1.1.3" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="A3.I13.i1.p1.1.4" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Action</span><span id="A3.I13.i1.p1.1.5" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, or </span><span id="A3.I13.i1.p1.1.6" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tissue</span><span id="A3.I13.i1.p1.1.7" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A3.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I13.i2.p1" class="ltx_para">
<span id="A3.I13.i2.p1.1" class="ltx_p"><span id="A3.I13.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Group these mentions into clusters based on their semantic similarity and clinical meaning. It is better to create more specific, smaller clusters than to group dissimilar items.</span></span>
</span></span>
<span id="A3.I13.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I13.i3.p1" class="ltx_para">
<span id="A3.I13.i3.p1.1" class="ltx_p"><span id="A3.I13.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">For each cluster, provide a concise and descriptive name that captures the core concept (e.g., ”Energy Application”, ”Traction”, ”Vascular Structures”).</span></span>
</span></span>
<span id="A3.I13.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I13.i4.p1" class="ltx_para">
<span id="A3.I13.i4.p1.1" class="ltx_p"><span id="A3.I13.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Handle synonyms, abbreviations, slight misspellings, and minor variations in phrasing by placing them in the same cluster.</span></span>
</span></span>
</span>
<span id="A3.T13.pic1.2.3" class="ltx_p"><span id="A3.T13.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Formatting<span id="A3.T13.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A3.I14" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I14.i1.p1" class="ltx_para">
<span id="A3.I14.i1.p1.1" class="ltx_p"><span id="A3.I14.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Produce a structured list. For each cluster, first state the cluster name, then list all the member mentions.</span></span>
</span></span>
<span id="A3.I14.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I14.i2.p1" class="ltx_para">
<span id="A3.I14.i2.p1.1" class="ltx_p"><span id="A3.I14.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do not include explanations or summaries outside of the structured list.</span></span>
</span></span>
</span>
<span id="A3.T13.pic1.2.4" class="ltx_p"><span id="A3.T13.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Input<span id="A3.T13.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.I15" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I15.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I15.i1.p1" class="ltx_para">
<span id="A3.I15.i1.p1.1" class="ltx_p"><span id="A3.I15.i1.p1.1.1" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Category</span><span id="A3.I15.i1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> (str): The type of mentions provided (e.g., ”Action”).</span></span>
</span></span>
<span id="A3.I15.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I15.i2.p1" class="ltx_para">
<span id="A3.I15.i2.p1.1" class="ltx_p"><span id="A3.I15.i2.p1.1.1" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Mentions</span><span id="A3.I15.i2.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> (list of str): The raw textual mentions to be clustered.</span></span>
</span></span>
</span>
<span id="A3.T13.pic1.2.5" class="ltx_p"><span id="A3.T13.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Output<span id="A3.T13.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A3.I16" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I16.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I16.i1.p1" class="ltx_para">
<span id="A3.I16.i1.p1.1" class="ltx_p"><span id="A3.I16.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">(str) A formatted string listing each cluster name followed by its members.</span></span>
</span></span>
</span>
<span id="A3.T13.pic1.2.6" class="ltx_p"><span id="A3.T13.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Category: {category_name}
<br class="ltx_break">Mentions: {list_of_mentions}
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
Clustered Output:
<span id="A3.T13.pic1.2.6.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>