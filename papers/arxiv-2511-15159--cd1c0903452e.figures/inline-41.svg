</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.89 8.89)"><foreignobject style="--ltx-fo-width:39.08em;--ltx-fo-height:18.11em;--ltx-fo-depth:0em;font-size:9.25pt;" height="231.85" overflow="visible" transform="matrix(1 0 0 -1 0 231.85)" width="500.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.08em;">
<span id="A3.T11.pic1.2.1" class="ltx_p"><span id="A3.T11.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instruction.<span id="A3.T11.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are working in the context of verbal feedback delivered by a trainer to a trainee in a live surgery. Extract the following aspects from given feedback line:
<br class="ltx_break">action - identify any phrases that explicitly indicate an action the trainee is expected to perform. This may include instructions, commands, or recommendations. If no such actions are present, produce N̈ONE\̈\ 
Interpret unclear or incomplete feedback as concretely as possible, but avoid introducing assumptions not supported by the text. Interpret phases describing actions (e,g., ÿou’re gonna,̈ ÿou will,̈ Ï want you to,̈ Ï like the)̈ as instructions for the trainee. 
<br class="ltx_break">Express extracted actions in the imperative form. Extract just the broad action with optional modifiers (e.g., ’come closer’, ’tap litte’, ’check left side’, ’start doing’), but don’t include the object of the action, such as anatomic component or instrument used. 
<br class="ltx_break">Produce output strictly in the format [action 1, action 2, …].</span></span></span>
<span id="A3.T11.pic1.2.2" class="ltx_p"><span id="A3.T11.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Process this feedback line: {feedback_line}
<span id="A3.T11.pic1.2.2.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>