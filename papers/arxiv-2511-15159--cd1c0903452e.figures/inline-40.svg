<span id="A3.T10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.32em;">
<span id="A3.T10.pic1.2.1" class="ltx_p"><span id="A3.T10.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instruction.<span id="A3.T10.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are working in the context of verbal feedback delivered by a trainer to a trainee in a live robot-assystec daVinci surgery. Extract the following aspects from given feedback line:
<br class="ltx_break">instrument or tool - identify any mentions of surgical instrument or tool. If no instrument or tool is mentioned, produce N̈ONE\̈\ 
Make sure you extract all and every surgical instruments or tools including robotic daVinci instruments, make sure to extract mentions of instruments or tools such as catheter, needle, stitches, sutures, robotic arms, graspers, forcepts, retractor, spreader, electrocautery, energy devices, camera, left hand, right hand, 4th arm or others. 
<br class="ltx_break">Also extract instruments and tools that are strongly implied, even if not mentioned explicitly, based on the action context. 
<br class="ltx_break">Produce output strictly in the format [instrument 1, instrument 2, …].</span></span></span>
<span id="A3.T10.pic1.2.2" class="ltx_p"><span id="A3.T10.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Process this feedback line: {feedback_line}
