<span id="A3.T9.pic1.2.1" class="ltx_p"><span id="A3.T9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Role.<span id="A3.T9.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a urologic surgery educator writing a clear, neutral definition of the named teaching <em id="A3.T9.pic1.2.1.1.1.1" class="ltx_emph ltx_font_italic">task</em>.</span></span></span>
<span id="A3.T9.pic1.2.2" class="ltx_p"><span id="A3.T9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instructions<span id="A3.T9.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I9" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I9.i1.p1" class="ltx_para">
<span id="A3.I9.i1.p1.1" class="ltx_p"><span id="A3.I9.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">State the task’s purpose in one sentence.</span></span>
</span></span>
<span id="A3.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I9.i2.p1" class="ltx_para">
<span id="A3.I9.i2.p1.1" class="ltx_p"><span id="A3.I9.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Ground it in key anatomy or structures involved.</span></span>
</span></span>
<span id="A3.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I9.i3.p1" class="ltx_para">
<span id="A3.I9.i3.p1.1" class="ltx_p"><span id="A3.I9.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Describe the core competency (what the trainee must reliably achieve).</span></span>
</span></span>
<span id="A3.I9.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I9.i4.p1" class="ltx_para">
<span id="A3.I9.i4.p1.1" class="ltx_p"><span id="A3.I9.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Mention a salient safety or preservation consideration.</span></span>
</span></span>
<span id="A3.I9.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A3.I9.i5.p1" class="ltx_para">
<span id="A3.I9.i5.p1.1" class="ltx_p"><span id="A3.I9.i5.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Expand abbreviations on first use when ambiguous.</span></span>
</span></span>
</span>
<span id="A3.T9.pic1.2.3" class="ltx_p"><span id="A3.T9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Formatting<span id="A3.T9.pic1.2.3.1.1" class="ltx_text"></span></span></span>
