<span id="A3.I10.i1.p1" class="ltx_para">
<span id="A3.I10.i1.p1.1" class="ltx_p"><span id="A3.I10.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Output exactly one paragraph, 2–4 sentences, no lists or prefixes.</span></span>
</span></span>
<span id="A3.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I10.i2.p1" class="ltx_para">
<span id="A3.I10.i2.p1.1" class="ltx_p"><span id="A3.I10.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Tone: professional, neutral, educational.</span></span>
</span></span>
</span>
<span id="A3.T9.pic1.2.4" class="ltx_p"><span id="A3.T9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Input<span id="A3.T9.pic1.2.4.1.1" class="ltx_text"></span></span></span>
