<span id="A3.T8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.38em;">
<span id="A3.T8.pic1.1.1" class="ltx_p"><span id="A3.T8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Procedure Definition Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.47 24.08)"><foreignobject style="--ltx-fo-width:39.32em;--ltx-fo-height:38.11em;--ltx-fo-depth:1.3em;font-size:9.25pt;" height="504.41" overflow="visible" transform="matrix(1 0 0 -1 0 487.81)" width="503.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.T8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.32em;">
<span id="A3.T8.pic1.2.1" class="ltx_p"><span id="A3.T8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Role.<span id="A3.T8.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a urologic surgery educator writing a clear, neutral definition of the named procedure.</span></span></span>
<span id="A3.T8.pic1.2.2" class="ltx_p"><span id="A3.T8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instructions<span id="A3.T8.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I5" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I5.i1.p1" class="ltx_para">
<span id="A3.I5.i1.p1.1" class="ltx_p"><span id="A3.I5.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">State the purpose/indications in one sentence.</span></span>
</span></span>
<span id="A3.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I5.i2.p1" class="ltx_para">
<span id="A3.I5.i2.p1.1" class="ltx_p"><span id="A3.I5.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Describe the essential operative scope (what is removed, repaired, or reconstructed).</span></span>
</span></span>
<span id="A3.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I5.i3.p1" class="ltx_para">
<span id="A3.I5.i3.p1.1" class="ltx_p"><span id="A3.I5.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Note common approach variants (e.g., open, laparoscopic, robotic, endoscopic) without steps.</span></span>
</span></span>
<span id="A3.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I5.i4.p1" class="ltx_para">
<span id="A3.I5.i4.p1.1" class="ltx_p"><span id="A3.I5.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Optionally mention a high-level recovery or outcome consideration in one short clause.</span></span>
</span></span>
<span id="A3.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A3.I5.i5.p1" class="ltx_para">
<span id="A3.I5.i5.p1.1" class="ltx_p"><span id="A3.I5.i5.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Keep it factual, jargon-light, and generalizable.</span></span>
</span></span>
</span>
<span id="A3.T8.pic1.2.3" class="ltx_p"><span id="A3.T8.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Formatting<span id="A3.T8.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A3.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I6.i1.p1" class="ltx_para">
<span id="A3.I6.i1.p1.1" class="ltx_p"><span id="A3.I6.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Output exactly one paragraph, 3–5 sentences, no lists or prefixes.</span></span>
</span></span>
<span id="A3.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I6.i2.p1" class="ltx_para">
<span id="A3.I6.i2.p1.1" class="ltx_p"><span id="A3.I6.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Tone: professional, neutral, educational.</span></span>
</span></span>
</span>
<span id="A3.T8.pic1.2.4" class="ltx_p"><span id="A3.T8.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Input<span id="A3.T8.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.I7" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I7.i1.p1" class="ltx_para">
<span id="A3.I7.i1.p1.1" class="ltx_p"><span id="A3.I7.i1.p1.1.1" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Procedure Name</span><span id="A3.I7.i1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> (str; urology).</span></span>
</span></span>
</span>
<span id="A3.T8.pic1.2.5" class="ltx_p"><span id="A3.T8.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Output<span id="A3.T8.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A3.I8" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I8.i1.p1" class="ltx_para">
<span id="A3.I8.i1.p1.1" class="ltx_p"><span id="A3.I8.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">(str) Single-paragraph definition covering purpose, scope, approach variants, and (optionally) recovery/outcome.</span></span>
</span></span>
</span>
<span id="A3.T8.pic1.2.6" class="ltx_p"><span id="A3.T8.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Procedure Name: {procedure_name}
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
Definition:
