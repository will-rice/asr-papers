<span id="A3.T12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.08em;">
<span id="A3.T12.pic1.2.1" class="ltx_p"><span id="A3.T12.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Instruction.<span id="A3.T12.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are working in the context of verbal feedback delivered by a trainer to a trainee in a live robot-assystec daVinci surgery. Extract the following aspects from given feedback line:
<br class="ltx_break">tissue, visual body part, or anatomic elements - identify any mentions of tissue, visual body part, or anatomic elements. If none is mentioned, produce N̈ONE\̈\ 
Make sure you extract all and every tissue, visual body part, or anatomic elements mentiond together with its property, if mentioned, including urether, bladder neck, small prostate, prostate contour, lateral thing, anteiror part or others. 
<br class="ltx_break">Some mentions are colloquial (e.g., bleeder is vein) or abbreviated (e.g., SV is Seminal Vesicles). Interpret these in the context of abdominal urologic surgery and express in proper medical form. 
<br class="ltx_break">If the term is ambiguous (e.g., l̈ateral thingör änterior part)̈, interpret it in the surgical context and include it as an approximate or general anatomical reference (e.g., l̈ateral structureör änterior structure)̈. 
<br class="ltx_break">Produce output strictly in the format [element 1, element 2, …].</span></span></span>
<span id="A3.T12.pic1.2.2" class="ltx_p"><span id="A3.T12.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Process this feedback line: {feedback_line}
