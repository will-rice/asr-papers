<span id="p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.27em;">
<span id="p1.pic1.1.1" class="ltx_p ltx_align_left"><span id="p1.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#26171D;">FuseAlign: Forced Alignment in the Wild</span></span>
<span id="p1.pic1.1.2" class="ltx_p ltx_align_left"><span id="p1.pic1.1.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#26171D;">Mithilesh Vaidya</span><span id="p1.pic1.1.2.2" class="ltx_text ltx_font_sansserif" style="--ltx-fg-color:#26171D;">, <span id="p1.pic1.1.2.2.1" class="ltx_text ltx_font_bold">Stephen Bailey</span>, <span id="p1.pic1.1.2.2.2" class="ltx_text ltx_font_bold">Sumukh Badam</span>,
<span id="p1.pic1.1.2.2.3" class="ltx_text ltx_font_bold">Matthew Bendel</span>, <span id="p1.pic1.1.2.2.4" class="ltx_text ltx_font_bold">Xingzhe He</span></span></span>
<span id="p1.pic1.1.3" class="ltx_p"><span id="p1.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#26171D;">Descript, Inc.</span></span>
<span id="p1.pic1.1.4" class="ltx_p"><span id="p1.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{mithilesh, stephen, sumukh, matt.bendel, xingzhe}@descript.com</span></span>
<span id="p1.pic1.1.5" class="ltx_p"><span id="p1.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#26171D;">Word-level forced alignment estimates when each transcript word occurs in an audio recording. It underpins text-based media editing, subtitling, speech-data curation, and phonetic analysis. Existing evaluations understate the difficulty of forced alignment by relying on short, clean speech, perfect transcripts, and metrics that obscure consequential alignment errors. In contrast, real-world media and data-processing pipelines operate on long and diverse recordings. Additionally, forced aligners often operate on error-prone automatic speech recognition (ASR) output. We address these gaps with improved evaluation metrics, a scoring protocol for real ASR transcripts, and AlignBench, a benchmark spanning diverse speaker, acoustic, and text conditions. We further introduce FuseAlign, a transformer-based aligner trained on large-scale pseudo-labeled speech with online label correction. FuseAlign performs joint contextualization of audio and text for the localization of coarse words. The model then refines boundaries at millisecond resolution and detects missing transcript words in the audio without lexicon-based or Viterbi decoding. On AlignBench, FuseAlign substantially outperforms all baselines and remains robust under real ASR transcripts. Ablations show that convolutional upsampling and EMA-snapshot label correction matter more than model properties such as parameter count.</span></span>
<span id="p1.pic1.1.6" class="ltx_p"><span id="p1.pic1.1.6.1" class="ltx_text" style="position:relative; bottom:0.0pt;--ltx-fg-color:#000000;"><object type="image/svg+xml" data="2609.33650v1/descript_logo.svg" id="p1.pic1.g1" class="ltx_graphics ltx_img_landscape" style="aspect-ratio:74/18;" width="74" height="18"></object></span><span id="p1.pic1.1.6.2" class="ltx_text"></span></span>
</span></span></span></foreignobject></g></g></svg>