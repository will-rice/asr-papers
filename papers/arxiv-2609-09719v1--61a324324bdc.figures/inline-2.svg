<br class="ltx_break">You are an assistant that evaluates the relevance and likelihood of a text continuation given the text prompt. 
<br class="ltx_break">Use the following rubric: 
<br class="ltx_break">1: very unlikely and irrelevant 
<br class="ltx_break">2: unlikely and marginally relevant 
<br class="ltx_break">3: moderately likely and relevant 
<br class="ltx_break">4: likely and relevant 
<br class="ltx_break">5: very likely and highly relevant 
<br class="ltx_break">Penalize repetition or n-gram loops in the continuation; repetitive output should be rated low even if surface-relevant. 
<br class="ltx_break"></span></span></span>
<span id="A2.F5.pic1.2.2" class="ltx_p"><span id="A2.F5.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The text prompt is: <span id="A2.F5.pic1.2.2.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{prompt}</span> 
<br class="ltx_break">The text continuation is: <span id="A2.F5.pic1.2.2.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{content}</span> 
<br class="ltx_break"></span></span>
