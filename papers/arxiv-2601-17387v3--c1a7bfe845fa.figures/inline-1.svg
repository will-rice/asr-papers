<span id="A1.SS1.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.33em;">
<span id="A1.SS1.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target sentence (pinyin):
<br class="ltx_break"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">Hàn Mì’ěrdùn quèrèn Huò Huá Dé dàxué yīyuàn shōuzhì de bìngrén qíngkuàng wěndìng.
<br class="ltx_break" style="--ltx-break-space:5.0pt;"></span></span></span>
<span id="A1.SS1.SSS0.Px1.p2.pic1.1.2" class="ltx_p"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gloss:
<br class="ltx_break"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.2.1.1" class="ltx_text ltx_font_medium">Hamilton confirm Howard University hospital admit-<span id="A1.SS1.SSS0.Px1.p2.pic1.1.2.1.1.1" class="ltx_text ltx_font_smallcaps">de</span> patient condition stable.
<br class="ltx_break" style="--ltx-break-space:5.0pt;"></span></span></span>
<span id="A1.SS1.SSS0.Px1.p2.pic1.1.3" class="ltx_p"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Intended meaning:
<br class="ltx_break"><span id="A1.SS1.SSS0.Px1.p2.pic1.1.3.1.1" class="ltx_text ltx_font_medium">“Hamilton confirmed that the condition of the patients admitted by Howard University Hospital was stable.”</span></span></span>
</span></span></span></foreignobject></g></g></svg>