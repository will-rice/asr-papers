<span id="A7.p8.pic1.p15" class="ltx_para ltx_noindent">
<span id="A7.p8.pic1.p15.1" class="ltx_p">&lt;/ASSISTANT_RESPONSE&gt;</span>
</span></span></span></span>
<span id="A7.p8.pic1.2.16" class="ltx_p" style="width:389.5pt;"><span id="A7.p8.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A7.p8.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A7.p8.pic1.2.17" class="ltx_p" style="width:389.5pt;"><span id="A7.p8.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A7.p8.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A7.p8.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A7.p8.pic1.2.17.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A7.p8.pic1.2.17.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A7.p8.pic1.p17" class="ltx_para ltx_noindent">
<span id="A7.p8.pic1.p17.1" class="ltx_p">Focus on the most important ways the response could better follow the constitution. Do not just give feedback to refuse the response, only do it, if it is REALLY necessary as the model will be trained based on your feedback and should not learn to overrefuse. Address the response writer directly as &quot;you&quot;. Do not output a score, a grade, a JSON object, or any preamble, and do not quote principle numbers. Output only one or two sentences of actionable feedback.</span>
</span></span></span></span>
