</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.53 8.99)"><foreignobject style="--ltx-fo-width:37.1em;--ltx-fo-height:21.01em;--ltx-fo-depth:0.25em;font-size:10pt;" height="294.19" overflow="visible" transform="matrix(1 0 0 -1 0 290.73)" width="513.36"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.1em;">
<span id="A9.SS1.p3.pic1.2.1" class="ltx_p"><span id="A9.SS1.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p3.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p1.1" class="ltx_p">You will be doing an Instruction Following Assessment of an AI assistant response.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.2" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p3.pic1.2.3" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p3.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p3.1" class="ltx_p">Carefully read the &lt;USER_INPUT&gt; to assess how well the candidate response fulfills the task requirements. If the input includes a conversation history, the response must align with that context as well as the final instruction.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.4" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p3.pic1.2.5" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p5.1" class="ltx_p">**Scoring**: Rate the text on a scale of 1 to 5:</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.6" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p6.1" class="ltx_p">1. **Irrelevant**: No alignment.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.7" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p7.1" class="ltx_p">2. **Partial Focus**: Addresses one aspect poorly.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.8" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p8.1" class="ltx_p">3. **Partial Compliance**:</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.9" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p9.1" class="ltx_p">    - (1) Meets goal or restrictions, neglecting other.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.10" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p10.1" class="ltx_p">    - (2) Acknowledges both but slight deviations.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.11" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p11.1" class="ltx_p">4. **Almost There**: Near alignment, minor deviations.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.12" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p12.1" class="ltx_p">5. **Comprehensive Compliance**: Fully aligns, meets all requirements.</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.13" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p3.pic1.2.14" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p14.1" class="ltx_p">Here are the user inputs and the AI assistant response to evaluate:</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.15" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p3.pic1.2.16" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p16.1" class="ltx_p">&lt;USER_INPUT&gt;{prompt}&lt;/USER_INPUT&gt;</span>
</span></span></span></span>
<span id="A9.SS1.p3.pic1.2.17" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p3.pic1.2.18" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p3.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p3.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p3.pic1.2.18.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p3.pic1.2.18.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p3.pic1.p18" class="ltx_para ltx_noindent">
<span id="A9.SS1.p3.pic1.p18.1" class="ltx_p">&lt;ASSISTANT_RESPONSE_TO_EVALUATE&gt;{completion}&lt;/ASSISTANT_RESPONSE_TO_EVALUATE&gt;</span>
</span></span></span></span>
