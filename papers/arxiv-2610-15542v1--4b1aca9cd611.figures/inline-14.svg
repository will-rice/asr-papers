<span id="A9.SS1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.1em;">
<span id="A9.SS1.p6.pic1.2.1" class="ltx_p"><span id="A9.SS1.p6.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p1.1" class="ltx_p">You will be doing an Informativeness / Helpfulness Assessment of an AI assistant response.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.2" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.3" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p3" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p3.1" class="ltx_p">Evaluate if the candidate response fulfills the task objectives, provides high-quality, correct, and informative content, and respects any preceding conversation context if provided in the input.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.4" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.5" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p5" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p5.1" class="ltx_p">Helpfulness assessment emphasizes **Overall Quality** regarding correctness and informativenss.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.6" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.7" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p7" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p7.1" class="ltx_p">**Correctness**: Accurate computation, reasoning steps, and outputs without misunderstandings or fabrication.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.8" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.9" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p6.pic1.p9" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p9.1" class="ltx_p">When assessing informativeness, consider the following aspects:</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.10" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p10" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p10.1" class="ltx_p">1. **Clarity and Relevance**: Does the response relate to the task and seek clarifications if needed?</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.11" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.11.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.11.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p11" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p11.1" class="ltx_p">2. **Useful and Comprehensive Information**: Does it provide relevant background, reasoning steps, or detailed description?</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.12" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.12.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.12.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p12" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p12.1" class="ltx_p">3. **Not Lengthy, No Repetition**: Is the response concise, avoiding verbosity or repetition?</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.13" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.14" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.14.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.14.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p14" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p14.1" class="ltx_p">Score on a scale of 1 to 5 based on extent of helpfulness, regarding both informativeness and correctness:</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.15" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.15.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.15.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p15" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p15.1" class="ltx_p">1. **Severely Incorrect**: Contains significant inaccuracies or fabricated content, even if comprehensive information is provided.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.16" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.16.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.16.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p16" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p16.1" class="ltx_p">2. **Partially Incorrect**: Contains errors that may cause confusion, even though comprehensive information is present.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.17" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.17.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.17.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p17" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p17.1" class="ltx_p">3. **Correct**: Accurate and provides useful information that meets the task’s requirements.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.18" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.18.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.18.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p18" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p18.1" class="ltx_p">4. **Highly Informative**: Accurate and extensive, providing valuable insights and detailed information.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.19" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.19.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p6.pic1.2.19.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p6.pic1.2.19.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p6.pic1.p19" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p19.1" class="ltx_p">5. **Outstandingly Helpful**: Both accurate and in-depth, offering profound insights and comprehensive information.</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.20" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.21" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p6.pic1.p21" class="ltx_para ltx_noindent">
<span id="A9.SS1.p6.pic1.p21.1" class="ltx_p">Here are the user inputs and the AI assistant response to evaluate:</span>
</span></span></span></span>
<span id="A9.SS1.p6.pic1.2.22" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p6.pic1.2.23" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p6.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p6.pic1.2.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:389.5pt;">
<span id="A9.SS1.p6.pic1.p23" class="ltx_para ltx_noindent">
