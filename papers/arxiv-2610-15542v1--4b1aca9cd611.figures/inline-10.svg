<span id="A9.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.1em;">
<span id="A9.SS1.p2.pic1.2.1" class="ltx_p"><span id="A9.SS1.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p2.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p2.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p2.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.p2.pic1.p1.1" class="ltx_p">You are an impartial judge. Your role is to critically evaluate the quality of an AI assistant response based on a given criteria. You’ll receive an input with two sections, enclosed in tags: &lt;USER_INPUT&gt;...&lt;/USER_INPUT&gt; for the task instructions (and any accompanying context, if applicable), and &lt;ASSISTANT_RESPONSE_TO_EVALUATE&gt;...&lt;/ASSISTANT_RESPONSE_TO_EVALUATE&gt; for the AI assistant’s response.</span>
</span></span></span></span>
<span id="A9.SS1.p2.pic1.2.2" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p2.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:389.5pt;"></span></span></span>
<span id="A9.SS1.p2.pic1.2.3" class="ltx_p" style="width:389.5pt;"><span id="A9.SS1.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:389.5pt;--ltx-fg-color:#2E2F31;"><span id="A9.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p2.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A9.SS1.p2.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A9.SS1.p2.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:368.5pt;">
<span id="A9.SS1.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A9.SS1.p2.pic1.p3.1" class="ltx_p">Carefully read the provided input to understand the task, then assess how well the response fulfills the criteria requirements. If conversation history is present, ensure the response aligns with it; otherwise, evaluate based solely on the instruction. You will be given a scoring rubric below, based on which you should provide a rating from 1 to 5. Your output should only be an integer from 1 to 5. Do not output any additional text or explanations.</span>
</span></span></span></span>
