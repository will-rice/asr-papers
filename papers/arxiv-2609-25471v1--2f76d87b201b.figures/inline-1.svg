<span id="S5.SS4.SSS0.Px2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.07em;">
<span id="S5.SS4.SSS0.Px2.p3.pic1.1.1" class="ltx_p"><span id="S5.SS4.SSS0.Px2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Take-aways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 176.9)"><foreignobject style="--ltx-fo-width:44.93em;--ltx-fo-height:2.29em;--ltx-fo-depth:11.85em;font-size:10pt;" height="195.72" overflow="visible" transform="matrix(1 0 0 -1 0 31.75)" width="621.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.SSS0.Px2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="S5.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Contrary to the common assumption that a per-client </span><em id="S5.I1.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">online</em><span id="S5.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> teacher is too unstable to use, it matches or beats the broadcast </span><em id="S5.I1.i1.p1.1.4" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">global</em><span id="S5.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> teacher both in-domain and under domain shift.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The online teacher’s advantage comes from its within-round adaptation to each client’s distribution, but the same adaptivity makes it prone to instability, so it holds only when paired with frequent enough server training on the seed data.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The online teacher’s advantage over the global teacher shrinks as the seed grows stronger (</span><math id="S5.I1.i3.p1.m1" class="ltx_Math" alttext="\Delta\text{WER}=2.52" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">WER</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2.52</mn></mrow><annotation encoding="application/x-tex">\Delta\text{WER}=2.52</annotation></semantics></math><span id="S5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> at LS100 </span><math id="S5.I1.i3.p1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S5.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> CV down to </span><math id="S5.I1.i3.p1.m3" class="ltx_Math" alttext="-0.61" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.61</mn></mrow><annotation encoding="application/x-tex">-0.61</annotation></semantics></math><span id="S5.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> at LS960 </span><math id="S5.I1.i3.p1.m4" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S5.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> CV), but a </span><em id="S5.I1.i3.p1.1.6" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">transitioning</em><span id="S5.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> teacher (global </span><math id="S5.I1.i3.p1.m5" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S5.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> online at round </span><math id="S5.I1.i3.p1.m6" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math><span id="S5.I1.i3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">) recovers the gap and matches or beats both at every seed strength.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>