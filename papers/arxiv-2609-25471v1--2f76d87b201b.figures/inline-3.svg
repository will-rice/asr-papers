<span id="S7.SS4.SSS0.Px2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.07em;">
<span id="S7.SS4.SSS0.Px2.p3.pic1.1.1" class="ltx_p"><span id="S7.SS4.SSS0.Px2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Take-aways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 210.11)"><foreignobject style="--ltx-fo-width:44.93em;--ltx-fo-height:2.29em;--ltx-fo-depth:14.25em;font-size:10pt;" height="228.93" overflow="visible" transform="matrix(1 0 0 -1 0 31.75)" width="621.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS4.SSS0.Px2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="S7.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S7.I1.i1.p1.1" class="ltx_p"><span id="S7.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Across the 11 seed–client pairs, the global and online teachers </span><em id="S7.I1.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">with the stabilizer</em><span id="S7.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> substantially outperform existing SSFL methods (Static PL, FedNST, and Rao et al.), closing much of the gap to fully-supervised FL.</span></span>
</span></span>
<span id="S7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S7.I1.i2.p1.1" class="ltx_p"><span id="S7.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No single teacher dominates: the online teacher wins in-domain and on most cross-domain pairs, but under domain shift the two are close, so the more robust global teacher—less sensitive to the data augmentation and batch-size settings—is the safer choice.</span></span>
</span></span>
<span id="S7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i3.p1" class="ltx_para">
<span id="S7.I1.i3.p1.1" class="ltx_p"><span id="S7.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">These findings yield a simple recipe that needs no per-pair tuning: (1) use the online teacher in-domain and the global teacher under domain shift, (2) keep a plain supervised batch update on the server, (3) scale the server batch size with the dispersion of the server data, and (4) calibrate the SpecAugment strength (to audio duration for the online teacher).</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>