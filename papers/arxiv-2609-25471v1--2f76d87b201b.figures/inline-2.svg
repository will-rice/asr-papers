<span id="S6.SS4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.07em;">
<span id="S6.SS4.p4.pic1.1.1" class="ltx_p"><span id="S6.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Take-aways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 176.13)"><foreignobject style="--ltx-fo-width:44.93em;--ltx-fo-height:2.31em;--ltx-fo-depth:11.79em;font-size:10pt;" height="195.23" overflow="visible" transform="matrix(1 0 0 -1 0 32.03)" width="621.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="S6.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S6.I1.i1.p1.1" class="ltx_p"><span id="S6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The online teacher can break, and the failure is </span><em id="S6.I1.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">asymmetric</em><span id="S6.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: Ted </span><math id="S6.I1.i1.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S6.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> LS diverges while the reverse LS </span><math id="S6.I1.i1.p1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S6.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> Ted converges, so it is directional rather than a matter of domain-gap magnitude.</span></span>
</span></span>
<span id="S6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S6.I1.i2.p1.1" class="ltx_p"><span id="S6.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The breakage stems not from seed training but from the server update: the noise it injects—input-level from strong augmentation, optimizer-level from a small batch—pushes the model off-manifold and makes pseudo-labels inconsistent across clients, degrading WER or, in the extreme, diverging.</span></span>
</span></span>
<span id="S6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i3.p1" class="ltx_para">
<span id="S6.I1.i3.p1.1" class="ltx_p"><span id="S6.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This instability is stabilized simply, by reducing the data augmentation strength and increasing the batch size, which helps both the online and global teachers and restores convergence even on the pairs where the online teacher previously diverged.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>