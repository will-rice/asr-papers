repository:
  name: "ASR Papers"
  slug: "asr-papers"
  description: "A curated, automatically-updated collection of ASR papers with an LLM-friendly markdown corpus."
adapters:
  - name: arxiv
    enabled: true
    secret_env: null
    # Daily runs look back 8 days so a missed run never drops papers.
    lookback_days: 8
    page_size: 200
    max_pages: 10
    max_results: 2000
    # Walk history back to the corpus's earliest publication year, 90 days
    # per nightly run.
    backfill_start: 1991-08-01
    backfill_days: 365
    filters:
      # Title or abstract phrase match for each legacy search query.
      search_query: 'ti:"speech recognition" OR abs:"speech recognition" OR ti:"speech-to-text" OR abs:"speech-to-text" OR ti:"speech to text" OR abs:"speech to text" OR ti:"speech transcription" OR abs:"speech transcription" OR ti:"end-to-end ASR" OR abs:"end-to-end ASR" OR ti:"streaming ASR" OR abs:"streaming ASR" OR ti:"multilingual ASR" OR abs:"multilingual ASR" OR ti:"word error rate" OR abs:"word error rate" OR ti:"speech foundation model" OR abs:"speech foundation model" OR ti:"RNN transducer" OR abs:"RNN transducer"'
topic:
  include_any: []
  include_all: []
  exclude_any: []
  categories: []
  # Word-bounded ASR + ML + negative-keyword rule; see topic_plugin.py.
  plugin: topic_plugin:accept_topic
fetch:
  request_timeout_seconds: 30
  retries: 3
  backoff_seconds: 1
  total_deadline_seconds: 900
conversion:
  max_batches_per_run: 20
  max_papers: 20
  max_cost: 1000
  timeout_seconds: 1800
  html_cost: 2
  latex_cost: 4
  pdf_cost: 20
  deadline_seconds: 10800
concurrency:
  html: 4
  latex: 2
  pdf: 1
